name: nodekeep
services:
  operator:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8290:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/nodekeep.sqlite3
    volumes:
      - nodekeep_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  nodekeep_data:
